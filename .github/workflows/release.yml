name: Release

# Push a tag to build and publish a signed release:
#   git tag -a v1.0.0 -m "Midtrack 1.0.0"
#   git push origin v1.0.0
#
# A manual run only uploads workflow artifacts; it does not create a release.
# Required repository secrets are documented in docs/releasing.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/releasing.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 release.keystore keystore.properties

      - name: Test, lint and build signed artifacts
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease

      - name: Verify the APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name artifacts and checksums
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          test -n "$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "midtrack-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "midtrack-$VERSION.aab"
          sha256sum "midtrack-$VERSION.apk" "midtrack-$VERSION.aab" > SHA256SUMS.txt
          ls -lh midtrack-* SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: midtrack-apk
          path: midtrack-*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: midtrack-aab
          path: midtrack-*.aab
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: midtrack-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: midtrack-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            midtrack-*.apk \
            midtrack-*.aab \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Midtrack $GITHUB_REF_NAME" \
            --generate-notes
